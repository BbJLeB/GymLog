plugins {
    id 'com.android.application'
}

// Release workflow-ът подава версията и данните за подписване.
// Локално (Android Studio) остават стойностите по подразбиране.
def appVersionCode = (project.findProperty("appVersionCode") ?: "1").toString().toInteger()
def appVersionName = (project.findProperty("appVersionName") ?: "1.0").toString()
def keystorePath   = System.getenv("KEYSTORE_PATH")

android {
    namespace 'com.gymlog.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gymlog.app"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.10.1'
}
